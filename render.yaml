services:
  - type: web
    name: catalogo-italia
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - server.js
        - package.json
        - render.yaml
    envVars:
      - key: TMDB_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"
