name: Telecomando Taverna

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/telecomando.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compila
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash android/build.sh telecomando TelecomandoTaverna.apk
      - name: Pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "telecomando-${{ github.run_number }}" android/telecomando/out/TelecomandoTaverna.apk \
            --title "Telecomando Taverna 1.0.${{ github.run_number }}" \
            --notes "Sull'HDMI del box, Volume/Muto/Home del telecomando del proiettore vanno a Home Assistant." \
            --latest
