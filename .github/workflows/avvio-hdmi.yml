name: Avvio HDMI

on:
  push:
    branches: [main]
    paths:
      - 'avvio-hdmi/**'
      - '.github/workflows/avvio-hdmi.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compila
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash avvio-hdmi/build.sh
      - name: Pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "avvio-hdmi-${{ github.run_number }}" avvio-hdmi/out/AvvioHDMI.apk \
            --title "Avvio HDMI 1.0.${{ github.run_number }}" \
            --notes "App per proiettori Android TV: all'accensione passa all'ingresso HDMI." \
            --latest
